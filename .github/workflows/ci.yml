      - name: Discover and validate Qt installation
        run: |
          set -euxo pipefail
          find "$RUNNER_TEMP/Qt/6.8.3" -maxdepth 5 -type f -path '*/lib/cmake/Qt6/Qt6Config.cmake' -print
          QT_CONFIG="$(find "$RUNNER_TEMP/Qt/6.8.3" -type f -path '*/lib/cmake/Qt6/Qt6Config.cmake' -print -quit)"
          if [[ -z "$QT_CONFIG" ]]; then
            echo "Qt6Config.cmake was not installed. Directory listing:" >&2
            find "$RUNNER_TEMP/Qt/6.8.3" -maxdepth 5 -print >&2 || true
            exit 1
          fi
          QT_ROOT_DIR="${QT_CONFIG%/lib/cmake/Qt6/Qt6Config.cmake}"
          test -x "$QT_ROOT_DIR/bin/qt-cmake"
          for component in Core Gui Network Qml Quick QuickControls2; do
            test -f "$QT_ROOT_DIR/lib/cmake/Qt6${component}/Qt6${component}Config.cmake" || {
              echo "Missing Qt component: $component" >&2
