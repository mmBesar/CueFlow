  android-arm64:
    name: Android APK — arm64-v8a
    runs-on: ubuntu-24.04
    env:
      ANDROID_NDK_VERSION: 27.2.12479018
      QT_ANDROID_VERSION: '6.12.0'
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Prepare diagnostic log directory
        run: mkdir -p diagnostics

      - name: Install Android SDK and NDK packages
        run: |
          set -euxo pipefail
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            "ndk;${ANDROID_NDK_VERSION}" 2>&1 | tee diagnostics/android-sdk-install.log
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}/ndk-build" --version

      - name: Set up Python for Qt installer
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install aqtinstall and archive support
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check \
            'aqtinstall==3.3.0' \
            'py7zr==1.1.4' 2>&1 | tee diagnostics/python-aqt-setup.log
          python -m aqt version 2>&1 | tee -a diagnostics/python-aqt-setup.log

      - name: Check Android Qt repository architectures
        run: |
          set -euxo pipefail
          python -m aqt list-qt all_os android --arch "$QT_ANDROID_VERSION" 2>&1 | tee diagnostics/android-qt-architectures.log

      - name: Download Qt ${{ env.QT_ANDROID_VERSION }} Linux host tools
        run: |
          set -euxo pipefail
          python -m aqt install-qt linux desktop "$QT_ANDROID_VERSION" linux_gcc_64 \
            --outputdir "$RUNNER_TEMP/Qt" \
            2>&1 | tee diagnostics/android-qt-host-install.log

      - name: Download Qt ${{ env.QT_ANDROID_VERSION }} for Android
        run: |
          set -euxo pipefail
          # Qt 6.7+ Android archives are served from the all_os repository.
          # Install host tools separately so QT_HOST_PATH and its Qt modules are explicit.
          python -m aqt install-qt all_os android "$QT_ANDROID_VERSION" android_arm64_v8a \
            --outputdir "$RUNNER_TEMP/Qt" \
            2>&1 | tee diagnostics/android-qt-install.log

      - name: Discover and validate Android and host Qt installations
        run: |
          set -euxo pipefail
          find "$RUNNER_TEMP/Qt/$QT_ANDROID_VERSION" -maxdepth 7 -type f -path '*/lib/cmake/Qt6/Qt6Config.cmake' -print

          ANDROID_QT_CONFIG="$(find "$RUNNER_TEMP/Qt/$QT_ANDROID_VERSION" -type f -path '*/android_arm64_v8a/lib/cmake/Qt6/Qt6Config.cmake' -print -quit)"
          HOST_QT_CONFIG="$(find "$RUNNER_TEMP/Qt/$QT_ANDROID_VERSION" -type f -path '*/gcc_64/lib/cmake/Qt6/Qt6Config.cmake' -print -quit)"
          if [[ -z "$ANDROID_QT_CONFIG" || -z "$HOST_QT_CONFIG" ]]; then
            echo "Could not locate both Android and Linux host Qt installations." >&2
            find "$RUNNER_TEMP/Qt/$QT_ANDROID_VERSION" -maxdepth 6 -print >&2 || true
            exit 1
          fi
          ANDROID_QT_ROOT="${ANDROID_QT_CONFIG%/lib/cmake/Qt6/Qt6Config.cmake}"
          QT_HOST_PATH="${HOST_QT_CONFIG%/lib/cmake/Qt6/Qt6Config.cmake}"
          test -x "$ANDROID_QT_ROOT/bin/qt-cmake"
          for component in Core Gui Network Qml Quick QuickControls2; do
            test -f "$ANDROID_QT_ROOT/lib/cmake/Qt6${component}/Qt6${component}Config.cmake" || {
              echo "Missing Android Qt component: $component" >&2
              find "$ANDROID_QT_ROOT/lib/cmake" -maxdepth 2 -type f -name 'Qt6*Config.cmake' -printf '%P\n' | sort >&2
              exit 1
            }
          done
          test -f "$QT_HOST_PATH/lib/cmake/Qt6/Qt6Config.cmake"
          printf 'Android Qt root: %s\nHost Qt root: %s\n' "$ANDROID_QT_ROOT" "$QT_HOST_PATH"
          echo "QT_ROOT_DIR=$ANDROID_QT_ROOT" >> "$GITHUB_ENV"
          echo "QT_HOST_PATH=$QT_HOST_PATH" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$ANDROID_QT_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_QT_ROOT/bin" >> "$GITHUB_PATH"

      - name: Configure Android application
        run: |
          set -euxo pipefail
          "$QT_ROOT_DIR/bin/qt-cmake" \
            -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DCUEFLOW_BUILD_COMMIT="$GITHUB_SHA" \
            -DQT_ANDROID_DEPLOYMENT_TYPE=Debug \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DQT_ANDROID_PACKAGE_NAME=org.mmbesar.cueflow \
            -DQT_ANDROID_TARGET_SDK_VERSION=36 \
            -DQT_ANDROID_MIN_SDK_VERSION=28 \
            -DQT_ANDROID_ABIS=arm64-v8a 2>&1 | tee diagnostics/android-cmake-configure.log

      - name: Compile Android APK
        run: |
          set -euxo pipefail
          cmake --build build-android --target apk --parallel 2 2>&1 | tee diagnostics/android-build.log

      - name: Stage and verify installable Android test APK
        run: |
          set -euxo pipefail
          # QT_ANDROID_DEPLOYMENT_TYPE=Debug asks Qt to produce the standard
          # debug variant, which Gradle signs with its debug keystore. This is
          # for sideload testing, not a production/release signing identity.
          apk="$(find build-android -type f -path '*/outputs/apk/debug/*.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            echo 'No debug APK found under Gradle outputs.' >&2
            find build-android -type f -name '*.apk' -print >&2
            exit 1
          fi

          build_tools="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" \
            2>&1 | tee diagnostics/android-apksigner-verify.log
          "$build_tools/zipalign" -c -P 16 -v 4 "$apk" \
            2>&1 | tee diagnostics/android-zipalign-verify.log

          # Android 15/16 devices using 16 KB pages need both ZIP-aligned
          # uncompressed libraries and ELF LOAD segments aligned to 16 KB.
          readelf="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          unpacked="$(mktemp -d)"
          trap 'rm -rf "$unpacked"' EXIT
          unzip -q "$apk" 'lib/arm64-v8a/*.so' -d "$unpacked"
          mapfile -t shared_objects < <(find "$unpacked/lib/arm64-v8a" -type f -name '*.so' -print | sort)
          if (( ${#shared_objects[@]} == 0 )); then
            echo 'APK contains no arm64-v8a shared libraries.' >&2
            exit 1
          fi
          for so in "${shared_objects[@]}"; do
            mapfile -t alignments < <("$readelf" -lW "$so" | awk '$1 == "LOAD" { print $NF }')
            if (( ${#alignments[@]} == 0 )); then
              echo "No ELF LOAD segments found in $so" >&2
              exit 1
            fi
            for alignment in "${alignments[@]}"; do
              if (( alignment < 16384 )); then
                printf 'ELF segment is not 16 KB aligned: %s (p_align=%s)\n' "$so" "$alignment" >&2
                exit 1
              fi
            done
          done
          printf 'Verified %d arm64-v8a shared libraries for 16 KB ELF alignment.\n' "${#shared_objects[@]}"
          mkdir -p artifacts
          cp "$apk" artifacts/CueFlow-android-arm64-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: cueflow-android-arm64-debug
          path: artifacts/CueFlow-android-arm64-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: cueflow-android-failure-diagnostics
          path: |
            diagnostics/**
            build-android/CMakeCache.txt
            build-android/CMakeFiles/CMakeError.log
            build-android/CMakeFiles/CMakeOutput.log
            build-android/**/*.log
          if-no-files-found: warn
          retention-days: 7


  android-legacy-armv7:
    name: Legacy Android APK — Android 6+ (32-bit ARM)
    runs-on: ubuntu-22.04
    env:
      QT_LEGACY_VERSION: '5.15.2'
      ANDROID_NDK_VERSION: '21.3.6528147'
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # The current Android command-line tools (installed by setup-android)
      # require JDK 17+. Qt 5.15's generated Gradle project below is built
      # with JDK 8, so set up the SDK under JDK 17 first and switch back later.
      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Prepare diagnostic log directory
        run: mkdir -p diagnostics

      - name: Install Android 6-compatible SDK and NDK
        run: |
          set -euxo pipefail
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-31' \
            'build-tools;31.0.0' \
            "ndk;${ANDROID_NDK_VERSION}" 2>&1 | tee diagnostics/android6-sdk-install.log
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}/ndk-build" --version

      - name: Install aqtinstall
        run: |
          set -euxo pipefail
          python3 -m pip install --disable-pip-version-check --upgrade pip
          python3 -m pip install --disable-pip-version-check 'aqtinstall==3.3.0' 'py7zr==1.1.4' \
            2>&1 | tee diagnostics/aqt-setup.log
          python3 -m aqt version

      - name: Verify Qt 5.15.2 Android package availability
        run: |
          set -euxo pipefail
          python3 -m aqt list-qt linux android --arch "$QT_LEGACY_VERSION" \
            2>&1 | tee diagnostics/qt5-android-architectures.log

      - name: Download Qt 5.15.2 Android toolchain
        run: |
          set -euxo pipefail
          python3 -m aqt install-qt linux android "$QT_LEGACY_VERSION" android \
            --outputdir "$RUNNER_TEMP/Qt" 2>&1 | tee diagnostics/qt5-android-install.log
          QT_ROOT_DIR="$RUNNER_TEMP/Qt/$QT_LEGACY_VERSION/android"
          test -x "$QT_ROOT_DIR/bin/qmake"
          test -x "$QT_ROOT_DIR/bin/androiddeployqt"
          echo "QT_LEGACY_ROOT=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          echo "$QT_ROOT_DIR/bin" >> "$GITHUB_PATH"

      - name: Switch to Java 8 for Qt 5.15 Gradle build
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify legacy Java toolchain
        run: |
          set -euxo pipefail
          java -version 2>&1 | tee diagnostics/legacy-java-version.log
          test "$(java -version 2>&1 | head -n 1)" != ""
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME"

      - name: Prepare CueFlow Android package identity
        run: |
          set -euxo pipefail
          # Qt 5.15/qmake does not provide the Qt 6 ANDROID_PACKAGE_NAME knob.
          # Copy Qt's own version-matched package template, then set both the
          # manifest package and Gradle applicationId to CueFlow's stable ID.
          template_source="$QT_LEGACY_ROOT/src/android/templates"
          template_dest="$GITHUB_WORKSPACE/android-legacy/package-template"
          test -s "$template_source/AndroidManifest.xml"
          test -s "$template_source/build.gradle"
          test -s "$template_source/res/values/libs.xml"
          rm -rf "$template_dest"
          mkdir -p "$template_dest"
          cp -a "$template_source/." "$template_dest/"
          python3 - "$template_dest" <<'PYTHON'
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          package = "org.mmbesar.cueflow.legacy"

          manifest_path = root / "AndroidManifest.xml"
          manifest = manifest_path.read_text(encoding="utf-8")
          manifest, count = re.subn(
              r'(<manifest\b[^>]*?\bpackage\s*=\s*["\'])[^"\']+(["\'])',
              lambda match: match.group(1) + package + match.group(2),
              manifest,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit("Could not set the root manifest package attribute")
          manifest_path.write_text(manifest, encoding="utf-8")

          gradle_path = root / "build.gradle"
          gradle = gradle_path.read_text(encoding="utf-8")
          app_id = re.compile(r'(?m)^(\s*applicationId\s+)["\'][^"\']+["\']')
          gradle, count = app_id.subn(lambda match: match.group(1) + '"' + package + '"', gradle)
          if count == 0:
              default_config = re.search(r'(?m)^\s*defaultConfig\s*\{', gradle)
              if not default_config:
                  raise SystemExit("Could not find defaultConfig block in Qt's build.gradle")
              insert_at = default_config.end()
              gradle = gradle[:insert_at] + '\n        applicationId "' + package + '"' + gradle[insert_at:]
          elif count > 1:
              raise SystemExit(f"Found {count} applicationId declarations; refusing ambiguous package setup")
          gradle_path.write_text(gradle, encoding="utf-8")

          # Validate both inputs before qmake/androiddeployqt can silently fall
          # back to the generic org.qtproject.example application ID.
          manifest_check = manifest_path.read_text(encoding="utf-8")
          gradle_check = gradle_path.read_text(encoding="utf-8")
          if not re.search(r'<manifest\b[^>]*\bpackage=["\']' + re.escape(package) + r'["\']', manifest_check, re.DOTALL):
              raise SystemExit("Custom manifest package ID verification failed")
          if not re.search(r'(?m)^\s*applicationId\s+["\']' + re.escape(package) + r'["\']', gradle_check):
              raise SystemExit("Custom Gradle applicationId verification failed")
          print(f"Prepared Android package identity: {package}")
          PYTHON
          grep -n 'package=' "$template_dest/AndroidManifest.xml"
          grep -n 'applicationId' "$template_dest/build.gradle"

      - name: Prepare Qt 5.15-compatible QML imports
        run: |
          set -euxo pipefail
          python3 scripts/prepare-qt5-legacy-qml.py | tee diagnostics/qt5-qml-compatibility.log
          test -s android-legacy/generated/Main.qml
          grep -Fx 'import QtQuick 2.15' android-legacy/generated/Main.qml
          grep -Fx 'import QtQuick.Controls 2.15' android-legacy/generated/Main.qml
          grep -Fx 'import QtQuick.Controls.Material 2.15' android-legacy/generated/Main.qml
          grep -Fx 'import QtQuick.Layouts 1.15' android-legacy/generated/Main.qml
          grep -Fx 'import QtQuick.Window 2.15' android-legacy/generated/Main.qml

      - name: Configure legacy Android build
        run: |
          set -euxo pipefail
          mkdir -p build-android6
          cd build-android6
          "$QT_LEGACY_ROOT/bin/qmake" "$GITHUB_WORKSPACE/android-legacy/CueFlow.pro" \
            "CUEFLOW_BUILD_COMMIT=$GITHUB_SHA" \
            'ANDROID_ABIS=armeabi-v7a' 2>&1 | tee ../diagnostics/qt5-qmake.log
          settings_file="$(find . -type f -name '*deployment-settings.json' -print -quit)"
          if [[ -z "$settings_file" ]]; then
            echo 'qmake did not generate Android deployment settings.' >&2
            find . -maxdepth 4 -type f | sort >&2
            exit 1
          fi
          printf 'Deployment settings: %s\n' "$settings_file"

      - name: Build, stage, and package legacy APK
        working-directory: build-android6
        run: |
          set -euxo pipefail
          # Qt 5.15's plain `make` compiles the native library. Its documented
          # `apk_install_target` then stages the application binary/resources
          # under android-build before androiddeployqt is run. Skipping that
          # staging target caused the reported missing app .so error.
          make -j2 2>&1 | tee ../diagnostics/qt5-make.log
          make -j2 apk_install_target 2>&1 | tee ../diagnostics/qt5-stage-android-build.log

          expected="$PWD/android-build/libs/armeabi-v7a/libcueflow-legacy_armeabi-v7a.so"
          if [[ ! -f "$expected" ]]; then
            echo "Qt staging target did not create expected application binary: $expected" >&2
            echo 'Shared libraries found in build tree:' >&2
            find . -type f -name '*.so' -print | sort >&2
            echo 'Android build tree:' >&2
            find android-build -maxdepth 5 -type f -print | sort >&2 || true
            exit 1
          fi
          ls -lh "$expected"

          settings_file="$(find . -type f -name '*deployment-settings.json' -print -quit)"
          if [[ -z "$settings_file" ]]; then
            echo 'qmake did not generate Android deployment settings.' >&2
            find . -maxdepth 4 -type f | sort >&2
            exit 1
          fi
          "$QT_LEGACY_ROOT/bin/androiddeployqt" \
            --input "$settings_file" \
            --output "$PWD/android-build" \
            --android-platform android-31 \
            --jdk "$JAVA_HOME" \
            --gradle 2>&1 | tee ../diagnostics/qt5-androiddeployqt.log
          echo 'APK files created by Qt 5.15:'
          find android-build -type f -name '*.apk' -print | sort

      - name: Verify and stage Android 6 APK
        run: |
          set -euxo pipefail
          apk="$(find build-android6/android-build -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            echo 'No legacy APK found.' >&2
            find build-android6 -type f -name '*.apk' -print >&2
            exit 1
          fi
          tools="$ANDROID_SDK_ROOT/build-tools/31.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk" \
            2>&1 | tee diagnostics/qt5-apksigner-verify.log
          "$tools/zipalign" -c -v 4 "$apk" \
            2>&1 | tee diagnostics/qt5-zipalign-verify.log
          "$tools/aapt" dump badging "$apk" | tee diagnostics/qt5-apk-badging.txt
          if ! grep -q "package: name='org.mmbesar.cueflow.legacy'" diagnostics/qt5-apk-badging.txt; then
            echo 'Legacy APK has the wrong application ID; inspect the staged Qt package templates:' >&2
            grep -n -E 'package=|applicationId' android-legacy/package-template/AndroidManifest.xml android-legacy/package-template/build.gradle 2>/dev/null || true
            grep -n -E 'package=|applicationId' build-android6/android-build/AndroidManifest.xml build-android6/android-build/build.gradle 2>/dev/null || true
            exit 1
          fi
          grep -q "sdkVersion:'21'" diagnostics/qt5-apk-badging.txt
          mkdir -p artifacts
          cp "$apk" artifacts/CueFlow-android6-armv7-legacy-debug.apk

      - name: Upload Android 6 legacy APK
        uses: actions/upload-artifact@v6
        with:
          name: cueflow-android6-armv7-legacy-debug
          path: artifacts/CueFlow-android6-armv7-legacy-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload legacy Android failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: cueflow-android6-failure-diagnostics
          path: |
            diagnostics/**
            build-android6/**/*.log
            build-android6/**/*.json
          if-no-files-found: warn
          retention-days: 7

  nixos-x86_64:
    name: NixOS native package — x86_64-linux
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Nix with flakes
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build NixOS-native CueFlow package
        run: |
          set -euxo pipefail
          nix --version
          mkdir -p artifacts
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "$GITHUB_SHA"
          qml_sha256="$(sha256sum qml/Main.qml | cut -d ' ' -f1)"
          printf 'source_commit=%s\nqml_main_sha256=%s\n' \
            "$source_commit" "$qml_sha256" > artifacts/build-info.txt
          nix build .#default --print-build-logs
          out="$(readlink -f result)"
          test -x "$out/bin/cueflow"
          printf '%s\n' "$out" > artifacts/store-path.txt
          printf 'package_store_path=%s\nbinary_sha256=%s\n' \
            "$out" "$(sha256sum "$out/bin/cueflow" | cut -d ' ' -f1)" \
            >> artifacts/build-info.txt
          nix-store --query --requisites "$out" | sort > artifacts/store-paths.txt
          nix flake metadata --json . > artifacts/flake-metadata.json
          if [[ -f flake.lock ]]; then
            cp flake.lock artifacts/flake.lock
          fi
          mapfile -t closure < artifacts/store-paths.txt
          nix-store --export "${closure[@]}" | gzip -1 > artifacts/cueflow-nixos-x86_64.store.gz
          test -s artifacts/cueflow-nixos-x86_64.store.gz
          du -h artifacts/cueflow-nixos-x86_64.store.gz
          cat artifacts/build-info.txt

      - name: Upload NixOS store closure
        uses: actions/upload-artifact@v6
        with:
          name: cueflow-nixos-x86_64-${{ github.sha }}
          path: artifacts/**
          if-no-files-found: error
          retention-days: 7
