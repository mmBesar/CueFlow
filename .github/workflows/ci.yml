name: CueFlow CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cueflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-amd64:
    name: Core tests — Linux amd64
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          set -euxo pipefail
          uname -a
          c++ --version
          cmake --version
          ninja --version

      - name: Configure core-only build
        run: >-
          cmake -S . -B build-core -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCUEFLOW_BUILD_APP=OFF
          -DBUILD_TESTING=ON

      - name: Compile core tests
        run: cmake --build build-core --parallel 2

      - name: Run CTest
        run: ctest --test-dir build-core --output-on-failure

      - name: Run standalone scroll tests
        run: bash ./scripts/test-scroll-model.sh

      - name: Test responsive desktop controls
        run: python3 ./scripts/test-desktop-ui.py

      - name: Test Linux bundle archive validation
        run: bash ./scripts/test-linux-package.sh

      - name: Test AppImage packaging control flow
        run: bash ./scripts/test-appimage-package.sh

  core-arm64:
    name: Core tests — Linux arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          set -euxo pipefail
          uname -a
          c++ --version
          cmake --version
          ninja --version

      - name: Configure core-only build
        run: >-
          cmake -S . -B build-core -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCUEFLOW_BUILD_APP=OFF
          -DBUILD_TESTING=ON

      - name: Compile core tests
        run: cmake --build build-core --parallel 2

      - name: Run CTest
        run: ctest --test-dir build-core --output-on-failure

      - name: Run standalone scroll tests
        run: bash ./scripts/test-scroll-model.sh

      - name: Test responsive desktop controls
        run: python3 ./scripts/test-desktop-ui.py

      - name: Test AppImage packaging control flow
        run: bash ./scripts/test-appimage-package.sh

  linux-amd64:
    name: Qt desktop build — Linux amd64
    runs-on: ubuntu-24.04
    env:
      QT_HOST: linux
      QT_ARCH: linux_gcc_64
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Prepare diagnostic log directory
        run: mkdir -p diagnostics

      - name: Install system dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake ninja-build \
            libgl1-mesa-dev libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xfixes0 libxcb-randr0 libxcb-render-util0 \
            libxcb-image0 libxcb-xinerama0 libx11-xcb1

      - name: Set up Python for Qt installer
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install aqtinstall and archive support
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check \
            'aqtinstall==3.3.0' \
            'py7zr==1.1.4' 2>&1 | tee diagnostics/python-aqt-setup.log
          python -m aqt version 2>&1 | tee -a diagnostics/python-aqt-setup.log

      - name: Check Qt repository architectures
        run: python -m aqt list-qt linux desktop --arch 6.8.3

      - name: Download Qt 6.8.3 packages
        run: |
          set -euxo pipefail
          python -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 \
            --modules qtsvg \
            --outputdir "$RUNNER_TEMP/Qt" \
            2>&1 | tee diagnostics/qt-install.log

      - name: Discover and validate Qt installation
        run: |
          set -euxo pipefail
          find "$RUNNER_TEMP/Qt/6.8.3" -maxdepth 5 -type f -path '*/lib/cmake/Qt6/Qt6Config.cmake' -print
          QT_CONFIG="$(find "$RUNNER_TEMP/Qt/6.8.3" -type f -path '*/lib/cmake/Qt6/Qt6Config.cmake' -print -quit)"
          if [[ -z "$QT_CONFIG" ]]; then
            echo "Qt6Config.cmake was not installed. Directory listing:" >&2
            find "$RUNNER_TEMP/Qt/6.8.3" -maxdepth 5 -print >&2 || true
            exit 1
          fi
          QT_ROOT_DIR="${QT_CONFIG%/lib/cmake/Qt6/Qt6Config.cmake}"
          test -x "$QT_ROOT_DIR/bin/qt-cmake"
          for component in Core Gui Network Qml Quick QuickControls2 Svg; do
            test -f "$QT_ROOT_DIR/lib/cmake/Qt6${component}/Qt6${component}Config.cmake" || {
              echo "Missing Qt component: $component" >&2
              find "$QT_ROOT_DIR/lib/cmake" -maxdepth 2 -type f -name 'Qt6*Config.cmake' -printf '%P\n' | sort >&2
              exit 1
            }
          done
          printf 'Resolved Qt root: %s\n' "$QT_ROOT_DIR"
          "$QT_ROOT_DIR/bin/qt-cmake" --version
          echo "QT_ROOT_DIR=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          echo "$QT_ROOT_DIR/bin" >> "$GITHUB_PATH"

      - name: Configure application and tests
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCUEFLOW_BUILD_APP=ON
          -DBUILD_TESTING=ON
          -DCUEFLOW_BUILD_COMMIT="$GITHUB_SHA"

      - name: Compile application and tests
        run: cmake --build build --parallel 2

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure

      - name: Stage and package installable Linux bundle
        run: |
          set -euxo pipefail
          rm -rf stage
          cmake --install build --prefix "$PWD/stage"
          source_version="$(sed -nE 's/^project\(CueFlow VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n1)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            test "$version" = "$source_version" || {
              echo "Release tag $GITHUB_REF_NAME does not match CMakeLists.txt version $source_version." >&2
              exit 1
            }
          else
            version="${source_version}-dev+${GITHUB_SHA:0:7}"
          fi
          ./scripts/package-linux-bundle.sh \
            "$PWD/stage" "$PWD/cueflow-linux-amd64.tar.gz" \
            "$version" "x86_64" "$GITHUB_SHA"

      - name: Upload Linux amd64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: cueflow-linux-amd64
          path: cueflow-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux amd64 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cueflow-linux-amd64-failure-diagnostics
          path: |
            diagnostics/**
            build/CMakeCache.txt
            build/CMakeFiles/CMakeError.log
            build/CMakeFiles/CMakeOutput.log
            build/**/*.log
          if-no-files-found: warn
          retention-days: 7

  linux-arm64:
    name: Qt desktop build — Linux arm64
    runs-on: ubuntu-24.04-arm
    env:
      QT_HOST: linux_arm64
      QT_ARCH: linux_gcc_arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Prepare diagnostic log directory
        run: mkdir -p diagnostics

      - name: Install system dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
