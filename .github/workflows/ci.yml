  appimage-amd64:
    name: AppImage package — Linux x86_64
    needs: linux-amd64
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install host graphics and Qt XCB libraries for dependency scanning
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libgl1 libglx0 libglvnd0 libopengl0 \
            libgbm1 libdrm2 libwayland-client0 libwayland-egl1 \
            libwayland-cursor0 libwayland-server0 \
            libx11-6 libx11-xcb1 libxcb1 libxcb-glx0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render0 libxcb-render-util0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xinput0 \
            libxcb-xkb1 libxkbcommon0 libxkbcommon-x11-0
          # Fail early with a clear message instead of failing deep inside linuxdeploy.
          ldconfig -p > "$RUNNER_TEMP/ldconfig-cache.txt"
          for soname in libEGL.so.1 libxcb-cursor.so.0 libxcb-xkb.so.1 libxkbcommon-x11.so.0; do
            if ! grep -Fq "$soname" "$RUNNER_TEMP/ldconfig-cache.txt"; then
              echo "Required AppImage scan dependency is unavailable: $soname" >&2
              exit 1
            fi
          done

      - name: Set up Python for Qt installer
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Qt qmake and resources for AppImage deployment
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check 'aqtinstall==3.3.0' 'py7zr==1.1.4'
          python -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 --modules qtsvg --outputdir "$RUNNER_TEMP/Qt"
          QT_CONFIG="$(find "$RUNNER_TEMP/Qt/6.8.3" -type f -path '*/lib/cmake/Qt6/Qt6Config.cmake' -print -quit)"
          test -n "$QT_CONFIG"
          QT_ROOT_DIR="${QT_CONFIG%/lib/cmake/Qt6/Qt6Config.cmake}"
          test -x "$QT_ROOT_DIR/bin/qmake"
          echo "QT_ROOT_DIR=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Download Linux x86_64 deployment bundle
        uses: actions/download-artifact@v8
        with:
          name: cueflow-linux-amd64
          path: fetched

      - name: Extract and build AppImage
        run: |
          set -euxo pipefail
          mkdir -p stage
          archive="$(find fetched -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$archive" && test -s "$archive"
          tar -xzf "$archive" -C stage
          source_version="$(sed -nE 's/^project\(CueFlow VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n1)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            test "$version" = "$source_version"
          else
            version="${source_version}-dev+${GITHUB_SHA:0:7}"
          fi
          ./scripts/package-appimage.sh \
            "$PWD/stage" "$PWD/CueFlow-Linux-x86_64-${version}.AppImage" \
            "$version" x86_64 "$GITHUB_SHA"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: cueflow-appimage-amd64
          path: CueFlow-Linux-x86_64-*.AppImage
          if-no-files-found: error
          retention-days: 7

