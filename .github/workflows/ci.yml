      - name: Download Qt 6.8.3 packages
        run: |
          set -euxo pipefail
          python -m aqt install-qt linux_arm64 desktop 6.8.3 linux_gcc_arm64 \
            --outputdir "$RUNNER_TEMP/Qt" \
